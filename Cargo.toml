[package]
name = "actum"
version = "0.1.0"
edition = "2024"
description = "A terminal-first task manager backed by PostgreSQL"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
dotenvy = "0.15"
ratatui = "0.30.2"
rmcp = { version = "3.2.0", features = ["server", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "chrono"] }
textwrap = "0.16"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time"] }
